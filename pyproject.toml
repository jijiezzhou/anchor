[project]
name = "anchor"
version = "0.1.0"
description = "Graph-aware RAG for personal markdown vaults. Your wikilinks are training data — stop throwing them away."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jijie Zhou" }]
dependencies = [
    "ollama>=0.4.0",
    "anthropic>=0.40.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
anchor = "anchor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
